name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/openbao-plugin-gitea_linux_amd64 ./cmd/openbao-plugin-gitea
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/openbao-plugin-gitea_linux_arm64 ./cmd/openbao-plugin-gitea

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum openbao-plugin-gitea_linux_amd64 openbao-plugin-gitea_linux_arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # OpenBao declarative plugins download this image by digest; the binary
      # inside it has the same SHA-256 as the release asset for its platform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
